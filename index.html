<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards Medicina - Repetição Espaçada</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    .perspective { perspective: 1000px; }
    .card-inner {
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-front, .card-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card-back { transform: rotateY(180deg); }

    .draggable-card {
      touch-action: none;
      user-select: none;
      cursor: grab;
    }
    .draggable-card:active {
      cursor: grabbing;
    }
    .card-swiping {
      transition: transform 0.15s ease-out, opacity 0.15s ease-out;
    }
    .card-reset {
      transition: transform 0.3s ease-out, opacity 0.3s ease-out;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans">

  <!-- CABEÇALHO -->
  <header class="w-full max-w-5xl flex justify-between items-center py-4 border-b border-slate-800">
    <div class="flex items-center gap-3">
      <button id="home-btn" class="hidden bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 rounded-lg border border-slate-700 transition" title="Voltar ao Painel">
        🏠 Início
      </button>
      <h1 class="text-2xl font-bold text-indigo-400">Flashcards Medicina</h1>
    </div>

    <div class="flex items-center gap-3">
      <label class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium py-2 px-3 rounded-lg cursor-pointer transition">
        + PDF Temporário
        <input type="file" id="pdf-input" accept="application/pdf" class="hidden">
      </label>
    </div>
  </header>

  <!-- TELA 1: DASHBOARD / PAINEL PRINCIPAL -->
  <main id="dashboard-view" class="w-full max-w-5xl my-6 flex flex-col gap-6">
    
    <!-- Painel de Revisão Espaçada do Dia -->
    <section class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 shadow-xl">
      <div class="flex flex-col md:flex-row justify-between md:items-center gap-4">
        <div>
          <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">
            <span>🧠</span> Repetição Espaçada (SRS)
          </h2>
          <p id="srs-summary-text" class="text-xs text-slate-400 mt-1">Calculando cards pendentes para hoje...</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button id="start-due-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-5 rounded-xl transition shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2 disabled:opacity-50">
            🔥 Revisar Cards de Hoje (<span id="due-count">0</span>)
          </button>
          <button id="start-random-btn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2">
            🎲 Estudo Livre (Tudo)
          </button>
        </div>
      </div>
    </section>

    <!-- Grade de Matérias Cadastradas -->
    <section>
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-300 flex items-center gap-2">
          <span>📚</span> Minhas Matérias
        </h3>
        <button id="reset-srs-btn" class="text-xs text-slate-500 hover:text-rose-400 underline transition">Zerar Histórico de Revisões</button>
      </div>

      <div id="decks-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="col-span-full text-center py-10 text-slate-500">
          Carregando biblioteca de matérias do GitHub...
        </div>
      </div>
    </section>
  </main>

  <!-- TELA 2: ÁREA DE ESTUDO DOS FLASHCARDS -->
  <main id="study-view" class="flex-1 flex flex-col items-center justify-center my-4 w-full max-w-2xl relative hidden">
    
    <!-- Header da Sessão -->
    <div class="w-full flex justify-between items-center mb-2 px-2 text-xs text-slate-400">
      <span id="current-deck-title" class="font-bold text-indigo-400 uppercase tracking-wider">Matéria</span>
      <span id="card-counter" class="text-slate-300 font-medium">Card 1 de 1</span>
    </div>

    <!-- Container do Flashcard -->
    <div id="card-container" class="w-full h-[430px] perspective relative">
      <div id="card-inner" class="card-inner draggable-card relative w-full h-full rounded-2xl shadow-2xl bg-slate-800 border border-slate-700">
        
        <!-- Frente -->
        <div class="card-front absolute inset-0 w-full h-full flex flex-col items-center justify-center p-4 rounded-2xl">
          <span class="absolute top-3 left-4 text-xs font-semibold uppercase tracking-wider text-indigo-400">Frente (Pergunta)</span>
          <div class="w-full h-full flex items-center justify-center overflow-hidden pt-6 pointer-events-none">
            <canvas id="front-canvas" class="max-w-full max-h-full object-contain rounded"></canvas>
          </div>
          <p class="absolute bottom-3 text-xs text-slate-500">Clique para ver a resposta</p>
        </div>

        <!-- Verso -->
        <div class="card-back absolute inset-0 w-full h-full flex flex-col items-center justify-center p-4 rounded-2xl">
          <span class="absolute top-3 left-4 text-xs font-semibold uppercase tracking-wider text-emerald-400">Verso (Resposta)</span>
          <div class="w-full h-full flex items-center justify-center overflow-hidden pt-6 pointer-events-none">
            <canvas id="back-canvas" class="max-w-full max-h-full object-contain rounded"></canvas>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- CONTROLES SRS (4 BOTÕES NO VERSO) -->
  <footer id="study-controls" class="w-full max-w-2xl flex flex-col items-center gap-3 mb-4 hidden">
    <div id="srs-buttons" class="w-full grid grid-cols-4 gap-2">
      <button onclick="responderSRS(1)" class="bg-rose-900/40 hover:bg-rose-800/70 border border-rose-700/50 text-rose-200 py-3 rounded-xl flex flex-col items-center transition">
        <span class="font-bold text-sm">Errei</span>
        <span class="text-[10px] opacity-75">1 dia</span>
      </button>
      <button onclick="responderSRS(2)" class="bg-amber-900/40 hover:bg-amber-800/70 border border-amber-700/50 text-amber-200 py-3 rounded-xl flex flex-col items-center transition">
        <span class="font-bold text-sm">Difícil</span>
        <span id="hard-label" class="text-[10px] opacity-75">x1.2</span>
      </button>
      <button onclick="responderSRS(3)" class="bg-emerald-900/40 hover:bg-emerald-800/70 border border-emerald-700/50 text-emerald-200 py-3 rounded-xl flex flex-col items-center transition">
        <span class="font-bold text-sm">Bom</span>
        <span id="good-label" class="text-[10px] opacity-75">x2.5</span>
      </button>
      <button onclick="responderSRS(4)" class="bg-sky-900/40 hover:bg-sky-800/70 border border-sky-700/50 text-sky-200 py-3 rounded-xl flex flex-col items-center transition">
        <span class="font-bold text-sm">Fácil</span>
        <span id="easy-label" class="text-[10px] opacity-75">x3.5</span>
      </button>
    </div>
    <p class="text-xs text-slate-500 text-center">
      Atalhos no teclado: <kbd class="px-1 bg-slate-800 rounded">1</kbd> Errei | <kbd class="px-1 bg-slate-800 rounded">2</kbd> Difícil | <kbd class="px-1 bg-slate-800 rounded">3</kbd> Bom | <kbd class="px-1 bg-slate-800 rounded">4</kbd> Fácil
    </p>
  </footer>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // Estados da aplicação
    let pdfFilesList = [];
    let cardsDeck = [];
    let currentCardIndex = 0;
    let currentDeckTitleText = "";

    // Elementos DOM
    const dashboardView = document.getElementById('dashboard-view');
    const studyView = document.getElementById('study-view');
    const studyControls = document.getElementById('study-controls');
    const homeBtn = document.getElementById('home-btn');
    const decksGrid = document.getElementById('decks-grid');
    const startDueBtn = document.getElementById('start-due-btn');
    const dueCountEl = document.getElementById('due-count');
    const startRandomBtn = document.getElementById('start-random-btn');
    const srsSummaryText = document.getElementById('srs-summary-text');
    const resetSrsBtn = document.getElementById('reset-srs-btn');
    const pdfInput = document.getElementById('pdf-input');

    const cardInner = document.getElementById('card-inner');
    const cardCounter = document.getElementById('card-counter');
    const currentDeckTitle = document.getElementById('current-deck-title');

    // Identificação do GitHub
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    const githubUser = window.location.hostname.split('.')[0];
    const repoName = pathSegments[0] || '';

    /* -------------------------------------------------------------
       SISTEMA DE REPETIÇÃO ESPAÇADA (SUPERMEMO-2 MODIFICADO)
    ------------------------------------------------------------- */
    function getSrsData() {
      const data = localStorage.getItem('flashcards_srs_data');
      return data ? JSON.parse(data) : {};
    }

    function saveSrsData(data) {
      localStorage.setItem('flashcards_srs_data', JSON.stringify(data));
    }

    function getTodayString() {
      return new Date().toISOString().split('T')[0];
    }

    function getCardKey(card) {
      return `${card.fileKey}_card_${card.frontPageNum}`;
    }

    function isCardDue(cardData) {
      if (!cardData || !cardData.nextReview) return true; // Card novo é devido
      return cardData.nextReview <= getTodayString();
    }

    function responderSRS(rating) {
      if (cardsDeck.length === 0) return;

      const activeCard = cardsDeck[currentCardIndex];
      const cardKey = getCardKey(activeCard);
      const srsData = getSrsData();

      let cardInfo = srsData[cardKey] || {
        interval: 0,
        factor: 2.5,
        reviews: 0,
        nextReview: getTodayString()
      };

      // Cálculo de Repetição Espaçada (SM-2)
      if (rating === 1) { // Errei
        cardInfo.interval = 1;
        cardInfo.factor = Math.max(1.3, cardInfo.factor - 0.2);
        // O card volta para o final da fila de estudos da sessão atual
        cardsDeck.push(activeCard);
      } else {
        cardInfo.reviews++;
        if (cardInfo.reviews === 1) {
          cardInfo.interval = rating === 2 ? 1 : rating === 3 ? 3 : 6;
        } else {
          const mult = rating === 2 ? 1.2 : rating === 3 ? cardInfo.factor : cardInfo.factor * 1.3;
          cardInfo.interval = Math.round(cardInfo.interval * mult);
        }

        if (rating === 4) cardInfo.factor += 0.15;
        if (rating === 2) cardInfo.factor = Math.max(1.3, cardInfo.factor - 0.15);
      }

      // Agenda a próxima data
      const nextDate = new Date();
      nextDate.setDate(nextDate.getDate() + cardInfo.interval);
      cardInfo.nextReview = nextDate.toISOString().split('T')[0];

      srsData[cardKey] = cardInfo;
      saveSrsData(srsData);

      // Animação de saída
      cardInner.classList.add('card-swiping');
      cardInner.style.transform = rating === 1 ? 'translateX(-400px) rotate(-20deg)' : 'translateX(400px) rotate(20deg)';
      cardInner.style.opacity = '0';

      setTimeout(() => {
        if (currentCardIndex < cardsDeck.length - 1) {
          currentCardIndex++;
          renderCurrentCard();
        } else {
          alert("🎉 Excelente! Você concluiu todas as revisões pendentes para este bloco!");
          exibirDashboard();
        }
      }, 150);
    }

    resetSrsBtn.addEventListener('click', () => {
      if (confirm("Deseja apagar todo o histórico de agendamentos e revisões? Todos os cards voltarão a ser 'novos'.")) {
        localStorage.removeItem('flashcards_srs_data');
        carregarBibliotecaGitHub();
      }
    });

    /* -------------------------------------------------------------
       CARREGAMENTO E MONTAGEM DA BIBLIOTECA
    ------------------------------------------------------------- */
    async function carregarBibliotecaGitHub() {
      pdfFilesList = [];
      decksGrid.innerHTML = '';
      let totalDueGlobal = 0;

      if (githubUser && repoName) {
        try {
          const response = await fetch(`https://api.github.com/repos/${githubUser}/${repoName}/contents`);
          const files = await response.json();
          if (Array.isArray(files)) {
            pdfFilesList = files.filter(f => f.name.toLowerCase().endsWith('.pdf'));
          }
        } catch (e) { console.error(e); }
      }

      if (pdfFilesList.length > 0) {
        const srsData = getSrsData();

        for (let file of pdfFilesList) {
          const cleanName = file.name.replace(/\.pdf$/i, '').replace(/[-_]/g, ' ').toUpperCase();
          
          // Baixa metadados do PDF para contar os cards devido
          let dueCardsCount = 0;
          let totalCardsCount = 0;

          try {
            const pdfDoc = await pdfjsLib.getDocument(file.download_url || file.name).promise;
            totalCardsCount = Math.ceil(pdfDoc.numPages / 2);

            for (let i = 0; i < totalCardsCount; i++) {
              const k = `${file.name}_card_${(i * 2) + 1}`;
              if (isCardDue(srsData[k])) dueCardsCount++;
            }
          } catch(err) {}

          totalDueGlobal += dueCardsCount;

          const cardHtml = `
            <div onclick="estudarDeck('${file.download_url || file.name}', '${file.name}', '${cleanName}', false)" 
                 class="bg-slate-800 hover:bg-slate-750 border border-slate-700 hover:border-indigo-500/50 p-5 rounded-2xl cursor-pointer transition shadow-lg flex flex-col justify-between gap-4 group">
              <div>
                <div class="flex justify-between items-start gap-2 mb-1">
                  <h4 class="font-bold text-slate-100 group-hover:text-indigo-400 transition">${cleanName}</h4>
                  <span class="text-xs bg-slate-900 text-slate-400 px-2 py-0.5 rounded border border-slate-700">${totalCardsCount} cards</span>
                </div>
              </div>

              <div class="flex items-center justify-between text-xs pt-2 border-t border-slate-700/50">
                <span class="text-slate-400">Pendentes hoje:</span>
                <span class="font-bold px-2 py-0.5 rounded ${dueCardsCount > 0 ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'}">
                  ${dueCardsCount > 0 ? `${dueCardsCount} para revisar` : '✓ Em dia'}
                </span>
              </div>
            </div>
          `;
          decksGrid.innerHTML += cardHtml;
        }

        dueCountEl.textContent = totalDueGlobal;
        if (totalDueGlobal > 0) {
          srsSummaryText.textContent = `Você tem ${totalDueGlobal} cards aguardando revisão hoje.`;
          startDueBtn.disabled = false;
        } else {
          srsSummaryText.textContent = "Parabéns! Todas as suas revisões estão em dia para hoje.";
          startDueBtn.disabled = true;
        }

      } else {
        decksGrid.innerHTML = `
          <div class="col-span-full text-center py-10 bg-slate-800/40 rounded-2xl border border-slate-800">
            <p class="text-slate-400 font-medium">Nenhum PDF encontrado na pasta do repositório.</p>
            <p class="text-xs text-slate-500 mt-1">Envie seus PDFs diretamente para o GitHub para preencher este painel.</p>
          </div>
        `;
        srsSummaryText.textContent = "Nenhuma matéria encontrada.";
        startDueBtn.disabled = true;
      }
    }

    carregarBibliotecaGitHub();

    /* -------------------------------------------------------------
       INICIAR SESSÕES DE ESTUDO
    ------------------------------------------------------------- */
    async function estudarDeck(url, key, titulo, apenasDevidos = false) {
      currentDeckTitleText = titulo;
      currentDeckTitle.textContent = titulo;

      cardsDeck = [];
      const pdfDoc = await pdfjsLib.getDocument(url).promise;
      extrairCardsDePdf(pdfDoc, key, apenasDevidos);

      exibirTelaEstudo();
      iniciarFlashcards();
    }

    // Botão de Revisão do Dia (Geral)
    startDueBtn.addEventListener('click', async () => {
      if (pdfFilesList.length === 0) return;

      currentDeckTitle.textContent = "🔥 REVISÃO DO DIA (SRS)";
      cardsDeck = [];
      startDueBtn.textContent = "Carregando...";

      for (let file of pdfFilesList) {
        try {
          const pdfDoc = await pdfjsLib.getDocument(file.download_url || file.name).promise;
          extrairCardsDePdf(pdfDoc, file.name, true);
        } catch(e) {}
      }

      startDueBtn.innerHTML = `🔥 Revisar Cards de Hoje (<span id="due-count">${dueCountEl.textContent}</span>)`;
      embaralharArray(cardsDeck);

      exibirTelaEstudo();
      iniciarFlashcards();
    });

    // Botão Estudo Livre (Todas as Matérias)
    startRandomBtn.addEventListener('click', async () => {
      if (pdfFilesList.length === 0) return;

      currentDeckTitle.textContent = "🎲 ESTUDO LIVRE (TODAS AS MATÉRIAS)";
      cardsDeck = [];

      for (let file of pdfFilesList) {
        try {
          const pdfDoc = await pdfjsLib.getDocument(file.download_url || file.name).promise;
          extrairCardsDePdf(pdfDoc, file.name, false);
        } catch(e) {}
      }

      embaralharArray(cardsDeck);
      exibirTelaEstudo();
      iniciarFlashcards();
    });

    // Upload Temporário
    pdfInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const fileReader = new FileReader();
      fileReader.onload = async function() {
        const typedarray = new Uint8Array(this.result);
        const pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
        cardsDeck = [];
        currentDeckTitle.textContent = file.name;

        extrairCardsDePdf(pdfDoc, `TEMP_${file.name}`, false);
        exibirTelaEstudo();
        iniciarFlashcards();
      };
      fileReader.readAsArrayBuffer(file);
    });

    function extrairCardsDePdf(pdfDoc, fileKey, apenasDevidos) {
      const totalPages = pdfDoc.numPages;
      const numCards = Math.ceil(totalPages / 2);
      const srsData = getSrsData();

      for (let i = 0; i < numCards; i++) {
        const frontPageNum = (i * 2) + 1;
        const cardObj = {
          pdfDoc: pdfDoc,
          fileKey: fileKey,
          frontPageNum: frontPageNum,
          backPageNum: (i * 2) + 2 <= totalPages ? (i * 2) + 2 : null
        };

        const cardKey = getCardKey(cardObj);
        if (!apenasDevidos || isCardDue(srsData[cardKey])) {
          cardsDeck.push(cardObj);
        }
      }
    }

    function embaralharArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function exibirTelaEstudo() {
      dashboardView.classList.add('hidden');
      studyView.classList.remove('hidden');
      studyControls.classList.remove('hidden');
      homeBtn.classList.remove('hidden');
    }

    function exibirDashboard() {
      studyView.classList.add('hidden');
      studyControls.classList.add('hidden');
      homeBtn.classList.add('hidden');
      dashboardView.classList.remove('hidden');
      carregarBibliotecaGitHub();
    }

    homeBtn.addEventListener('click', exibirDashboard);

    /* -------------------------------------------------------------
       RENDERIZAÇÃO DOS CARDS
    ------------------------------------------------------------- */
    function iniciarFlashcards() {
      if (cardsDeck.length === 0) {
        alert("Não há cards pendentes para esta opção!");
        exibirDashboard();
        return;
      }
      currentCardIndex = 0;
      renderCurrentCard();
    }

    async function renderCurrentCard() {
      cardInner.classList.remove('flipped');
      cardInner.style.transform = '';
      cardInner.style.opacity = '1';

      const currentCard = cardsDeck[currentCardIndex];

      await renderPageToCanvas(currentCard.pdfDoc, currentCard.frontPageNum, 'front-canvas');

      if (currentCard.backPageNum) {
        await renderPageToCanvas(currentCard.pdfDoc, currentCard.backPageNum, 'back-canvas');
      } else {
        clearCanvas('back-canvas');
      }

      cardCounter.textContent = `Card ${currentCardIndex + 1} de ${cardsDeck.length}`;
    }

    async function renderPageToCanvas(pdfDoc, pageNum, canvasId) {
      const page = await pdfDoc.getPage(pageNum);
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      const viewport = page.getViewport({ scale: 1.5 });
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    }

    function clearCanvas(canvasId) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Virar Card no Clique
    cardInner.addEventListener('click', () => {
      cardInner.classList.toggle('flipped');
    });

    // Atalhos do Teclado para os 4 níveis SRS
    document.addEventListener('keydown', (e) => {
      if (studyView.classList.contains('hidden')) return;

      if (e.code === 'Space') {
        e.preventDefault();
        cardInner.classList.toggle('flipped');
      } else if (e.key === '1') responderSRS(1);
      else if (e.key === '2') responderSRS(2);
      else if (e.key === '3') responderSRS(3);
      else if (e.key === '4') responderSRS(4);
    });
  </script>
</body>
</html>
